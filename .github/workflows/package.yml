name: Package (Windows)

# Builds the Windows programs with PyInstaller and runs them on a machine that has
# neither Python nor ffmpeg on PATH. Then builds the installer (Inno Setup), installs it
# silently in each language and checks that the installed program starts in that language.
# One of the installations lets the installer download ffmpeg (the pinned build, for real) and
# makes a clip with it; the program's own download (stream2clip setup --ffmpeg) is run too.
# Runs when packaging changes, on version tags and on demand; the zip (programs only, no ffmpeg)
# is kept as a workflow artifact.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "packaging/**"
      - "pyproject.toml"
      - ".github/workflows/package.yml"
      - "src/stream2clip/ffmpeg.py"
      - "src/stream2clip/tools.py"
      - "src/stream2clip/sources.py"
      - "src/stream2clip/cli.py"

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: ffmpeg
        shell: pwsh
        run: |
          foreach ($attempt in 1..3) {
            choco install ffmpeg -y --no-progress
            if (Get-Command ffmpeg -ErrorAction SilentlyContinue) { break }
            Write-Host "ffmpeg is not installed after attempt $attempt"
            if ($attempt -lt 3) { Start-Sleep -Seconds 20 }
          }
          ffmpeg -version
      - run: pip install -e ".[gui,ingest,detect,obs,build]"
      - name: Build (programs only)
        run: python packaging/build_windows.py
      - name: Run the built programs without Python or ffmpeg on PATH
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $app = Resolve-Path "dist\stream2clip"
          # The real ffmpeg, not Chocolatey's launcher shim, goes next to the programs.
          $real = Get-ChildItem "C:\ProgramData\chocolatey\lib" -Recurse -Filter ffmpeg.exe | Sort-Object Length -Descending | Select-Object -First 1
          python packaging/build_windows.py --copy-ffmpeg-only --ffmpeg $real.FullName
          $work = New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\smoke"
          $env:PATH = "C:\Windows\System32;C:\Windows"

          function Check($what, [scriptblock]$run) {
            Write-Host "::group::$what"
            & $run
            if ($LASTEXITCODE -ne 0) { throw "$what failed with exit code $LASTEXITCODE" }
            Write-Host "::endgroup::"
          }

          Check "version" { & "$app\stream2clip.exe" --version }
          Check "test video with the bundled ffmpeg" { & "$app\ffmpeg.exe" -v error -y -f lavfi -i "testsrc2=s=160x90:r=10:d=3" -f lavfi -i "sine=frequency=440:duration=3" -pix_fmt yuv420p -shortest "$work\t.mp4" }
          Check "convert (finds ffmpeg next to the program)" { & "$app\stream2clip.exe" convert "$work\t.mp4" --start 0 --end 1 --width 80 -o "$work\t.gif" }
          if (-not (Test-Path "$work\t.gif")) { throw "convert wrote no file" }
          Check "yt-dlp passthrough" { & "$app\stream2clip.exe" yt-dlp --version }
          Check "setup report (everything required is there)" { & "$app\stream2clip.exe" setup --no-obs }
          Check "highlights from the chat fixture" { & "$app\stream2clip.exe" highlights --chat tests\data\youtube_real_excerpt.live_chat.json }

          # onnxruntime inside the bundle: there is no face in a test pattern, so the right answer is "No avatar found" (exit 1).
          $out = & "$app\stream2clip.exe" avatar "$work\t.mp4" 2>&1 | Out-String
          Write-Host $out
          if ($out -notmatch "No avatar found") { throw "avatar did not run the face detector" }

          # The websocket client inside the bundle: nothing listens on port 1, so "Cannot reach OBS" is the right answer.
          $out = & "$app\stream2clip.exe" replay -o "$work\r.gif" --port 1 2>&1 | Out-String
          Write-Host $out
          if ($out -notmatch "Cannot reach OBS") { throw "replay did not load the websocket client" }

          Check "singing sections of the test video" { & "$app\stream2clip.exe" singing "$work\t.mp4" }

          # The example translator ships next to the programs and loads inside the bundle: nothing listens on port 1,
          # so "Cannot reach the translation endpoint" is the right answer.
          if (-not (Test-Path "$app\translators\openai_compatible.py")) { throw "the example translator was not copied" }
          Set-Content "$work\h.json" '{"highlights": [{"rank": 1, "start": 0.0, "end": 2.0}]}' -Encoding utf8
          Set-Content "$work\s.srt" "1`n00:00:00,100 --> 00:00:01,500`nhello`n" -Encoding utf8
          $env:S2C_TRANSLATE_URL = "http://127.0.0.1:1/v1/chat/completions"
          $out = & "$app\stream2clip.exe" clips "$work\t.mp4" --highlights "$work\h.json" --subtitles "$work\s.srt" --translate ko --translator "$app\translators\openai_compatible.py" --layout none -f gif -o "$work\tr" 2>&1 | Out-String
          Write-Host $out
          if ($out -notmatch "Cannot reach the translation endpoint") { throw "the example translator did not run inside the bundle" }

          # The desktop app must start and stay up.
          $gui = Start-Process "$app\stream2clip-gui.exe" -PassThru
          Start-Sleep -Seconds 8
          if ($gui.HasExited) { throw "stream2clip-gui.exe exited with code $($gui.ExitCode)" }
          Stop-Process -Id $gui.Id -Force
          Write-Host "all programs ran"
          exit 0  # the expected exit code 1 of the avatar check above must not become the step's result
      - name: Installer (the zip is made first, so ffmpeg from the check above is in neither)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Remove-Item "dist\stream2clip\ffmpeg.exe", "dist\stream2clip\ffprobe.exe" -ErrorAction SilentlyContinue
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
          Get-ChildItem "C:\Program Files (x86)\Inno Setup 6\Languages" | Select-Object -ExpandProperty Name
          python packaging/build_windows.py --installer-only
          $setup = Get-ChildItem "dist\*-setup.exe" | Select-Object -First 1
          if (-not $setup) { throw "no installer was written" }
          Write-Host "installer: $($setup.Name) $([math]::Round($setup.Length / 1MB)) MB"
          $env:STREAM2CLIP_LANG = $null
          # A PC without ffmpeg: the installer and the programs must not see the runner's own.
          $env:PATH = "C:\Windows\System32;C:\Windows"
          $tools = "$env:USERPROFILE\.cache\stream2clip\tools"
          if (Test-Path "$tools\ffmpeg.exe") { throw "the runner already has a downloaded ffmpeg" }
          $work = New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\installed-work"

          foreach ($lang in "ko", "ja", "en") {
            $target = "$env:RUNNER_TEMP\installed-$lang"
            # Korean: as a person installs it, the ffmpeg task ticked. The others: the task unticked.
            $tasks = if ($lang -eq "ko") { @() } else { @("/MERGETASKS=!ffmpeg") }
            foreach ($attempt in 1..3) {
              $run = Start-Process $setup.FullName -ArgumentList (@("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/LANG=$lang", "/DIR=$target", "/LOG=$env:RUNNER_TEMP\setup-$lang.log") + $tasks) -Wait -PassThru
              if ($run.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\setup-$lang.log" -Tail 30; throw "the installer failed for $lang with exit code $($run.ExitCode)" }
              if ($lang -ne "ko" -or (Test-Path "$tools\ffmpeg.exe")) { break }
              Select-String -Path "$env:RUNNER_TEMP\setup-$lang.log" -Pattern "ffmpeg", "Download" | Select-Object -Last 12 | ForEach-Object { Write-Host $_.Line }
              Write-Host "the installer did not fetch ffmpeg (attempt $attempt)"
              if ($attempt -lt 3) { Start-Sleep -Seconds 20 }
            }
            foreach ($file in "stream2clip-gui.exe", "stream2clip.exe", "language.txt", "unins000.exe") {
              if (-not (Test-Path "$target\$file")) { throw "$file is missing after installing ($lang)" }
            }
            $chosen = (& "$target\stream2clip.exe" language).Trim()
            Write-Host "installed with /LANG=$lang -> the app starts in '$chosen'"
            if ($chosen -ne $lang) { throw "installed with $lang, but the app starts in '$chosen'" }

            $report = & "$target\stream2clip.exe" setup --no-obs 2>&1 | Out-String
            $code = $LASTEXITCODE
            Write-Host $report
            if ($lang -eq "ko") {
              foreach ($file in "ffmpeg.exe", "ffprobe.exe", "ffmpeg-LICENSE.txt") {
                if (-not (Test-Path "$tools\$file")) { throw "the installer did not put $file into $tools" }
              }
              if (Get-ChildItem $tools | Where-Object { $_.Name -notin "ffmpeg.exe", "ffprobe.exe", "ffmpeg-LICENSE.txt" }) { throw "something else was left in $tools" }
              if ($code -ne 0) { throw "ffmpeg was installed, but 'setup' still reports something required as missing" }
              & "$tools\ffmpeg.exe" -v error -y -f lavfi -i "testsrc2=s=160x90:r=10:d=3" -pix_fmt yuv420p "$work\t.mp4"
              & "$target\stream2clip.exe" convert "$work\t.mp4" --start 0 --end 1 --width 80 -o "$work\t.gif"
              if ($LASTEXITCODE -ne 0 -or -not (Test-Path "$work\t.gif")) { throw "the installed program made no clip with the ffmpeg the installer fetched" }
              Write-Host "a clip was made with the ffmpeg the installer downloaded"
            } else {
              if (Test-Path "$tools\ffmpeg.exe") { throw "ffmpeg was fetched although the task was unticked ($lang)" }
              if ($code -ne 1) { throw "without ffmpeg 'setup' must end with exit code 1, not $code" }
            }

            $remove = Start-Process "$target\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
            if ($remove.ExitCode -ne 0) { throw "the uninstaller failed with exit code $($remove.ExitCode)" }
            Start-Sleep -Seconds 2
            if (Test-Path "$target\stream2clip.exe") { throw "the uninstaller left the programs behind ($lang)" }
            if (Test-Path "$tools\ffmpeg.exe") { throw "the uninstaller left the downloaded ffmpeg behind ($lang)" }
          }
          Write-Host "the installer works in all three languages"

          # The same download from the program itself: what the app's button and "stream2clip setup --ffmpeg" do.
          $app = Resolve-Path "dist\stream2clip"
          foreach ($attempt in 1..3) {
            & "$app\stream2clip.exe" setup --ffmpeg --no-obs
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 3) { throw "'setup --ffmpeg' failed" }
            Start-Sleep -Seconds 20
          }
          $found = & "$app\stream2clip.exe" setup --no-obs | Out-String
          if ($found -notmatch [regex]::Escape("$tools\ffmpeg.exe")) { throw "the program does not use the ffmpeg it downloaded" }
          & "$app\stream2clip.exe" convert "$work\t.mp4" --start 1 --end 2 --width 80 -o "$work\t2.gif"
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path "$work\t2.gif")) { throw "no clip with the ffmpeg the program fetched" }
          Remove-Item $tools -Recurse -Force
          Write-Host "the program downloads ffmpeg by itself"
          exit 0
      # Pictures of the installer, to look at: the language list and the page with the ffmpeg task as a person sees them.
      - name: Pictures of the installer's language and task pages
        shell: pwsh
        continue-on-error: true
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot($name) {
            $area = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $picture = New-Object System.Drawing.Bitmap $area.Width, $area.Height
            [System.Drawing.Graphics]::FromImage($picture).CopyFromScreen($area.Left, $area.Top, 0, 0, $picture.Size)
            New-Item -ItemType Directory -Force "dist\pictures" | Out-Null
            $picture.Save("dist\pictures\$name.png")
          }
          $setup = Get-ChildItem "dist\*-setup.exe" | Select-Object -First 1
          $env:PATH = "C:\Windows\System32;C:\Windows"  # no ffmpeg in sight: the task is offered
          $shown = Start-Process $setup.FullName -PassThru
          Start-Sleep -Seconds 6
          Shot "installer-language"
          # OK on the language list, Next on the folder page: the task page.
          [System.Windows.Forms.SendKeys]::SendWait("{ENTER}")
          Start-Sleep -Seconds 4
          [System.Windows.Forms.SendKeys]::SendWait("{ENTER}")
          Start-Sleep -Seconds 3
          Shot "installer-tasks"
          Get-Process | Where-Object { $_.Path -like "*setup*" -or $_.ProcessName -like "*.tmp" -or $_.Id -eq $shown.Id } | Stop-Process -Force -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v7
        if: always()
        continue-on-error: true
        with:
          name: installer-pictures
          path: dist/pictures/*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: stream2clip-windows
          path: |
            dist/*.zip
            dist/*-setup.exe
          if-no-files-found: error
