name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.6"
      - run: ruff check .

  # Who wrote the commits of a pull request, and what their messages end with (CONTRIBUTING.md).
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python packaging/check_commits.py ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}

  linux:
    name: linux (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the oldest version pyproject.toml promises, the one the Windows build uses, and the newest
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      # Hosted runners sometimes stall for many minutes while downloading these packages
      # (131 MB, mostly ffmpeg's libraries) from a slow mirror. The downloaded files are
      # kept in a cache, so most runs install them without the mirror; the cache is renewed
      # when the runner image changes. Each attempt gets 4 minutes, then it is retried.
      - name: Runner image (the key of the package cache)
        id: image
        run: echo "name=${ImageOS:-linux}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - name: Downloaded system packages (cache)
        uses: actions/cache@v6
        with:
          path: ~/apt-archives
          key: apt-${{ steps.image.outputs.name }}
          restore-keys: apt-
      - name: System packages (ffmpeg, Xvfb, Qt runtime, CJK fonts)
        timeout-minutes: 15
        run: |
          mkdir -p ~/apt-archives/partial
          APT="sudo timeout 240 apt-get -o Dir::Cache::Archives=$HOME/apt-archives -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          for attempt in 1 2 3; do
            sudo dpkg --configure -a || true
            if $APT update && $APT install -y ffmpeg xvfb libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
              libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-randr0 libxcb-render-util0 libxcb-image0 fonts-noto-cjk; then
              break
            fi
            echo "apt attempt $attempt failed or timed out"
            sleep 10
          done
          sudo apt-get -o Dir::Cache::Archives=$HOME/apt-archives autoclean -y || true  # drop files of versions the mirror no longer has
          sudo rm -f ~/apt-archives/lock && sudo chown -R "$USER" ~/apt-archives  # readable for the cache step
          echo "$(ls ~/apt-archives | wc -l) files, $(du -sh ~/apt-archives | cut -f1) kept for the next run"
          ffmpeg -version
      - run: pip install -e ".[dev]"
      - name: Tests (including the end-to-end GUI flow on a virtual display)
        run: xvfb-run -a -s "-screen 0 1280x720x24" pytest -q

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      # The Chocolatey feed sometimes answers 504, or cannot find the package, and choco still
      # exits 0. Without ffmpeg the tests that need it are skipped, so retry, then take the build
      # the app itself downloads (stream2clip.tools.FFMPEG_BUILD, SHA-256 checked), and fail
      # loudly when neither works.
      - name: ffmpeg
        shell: pwsh
        run: |
          foreach ($attempt in 1..2) {
            choco install ffmpeg -y --no-progress
            if (Get-Command ffmpeg -ErrorAction SilentlyContinue) { break }
            Write-Host "ffmpeg is not installed after attempt $attempt"
            if ($attempt -lt 2) { Start-Sleep -Seconds 20 }
          }
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            Write-Host "Chocolatey has no ffmpeg: taking the build stream2clip pins"
            $url, $sha = python -c "from stream2clip.tools import FFMPEG_BUILD as b; print(b.url); print(b.sha256)"
            $zip = Join-Path $env:RUNNER_TEMP "ffmpeg.zip"
            Invoke-WebRequest -Uri $url -OutFile $zip
            $got = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
            if ($got -ne $sha.ToLower()) { throw "ffmpeg archive SHA-256 $got is not the pinned $sha" }
            $unpacked = Join-Path $env:RUNNER_TEMP "ffmpeg"
            Expand-Archive $zip -DestinationPath $unpacked
            $bin = (Get-ChildItem $unpacked -Recurse -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName
            $env:PATH = "$bin;$env:PATH"
            Add-Content -Path $env:GITHUB_PATH -Value $bin
          }
          ffmpeg -version
      - name: Tests (GUI tests run offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q
