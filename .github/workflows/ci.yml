name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Hosted runners sometimes stall here for many minutes on a slow package mirror.
      # Each attempt gets 4 minutes, then it is retried instead of hanging the job.
      - name: System packages (ffmpeg, Xvfb, Qt runtime, CJK fonts)
        timeout-minutes: 15
        run: |
          APT="sudo timeout 240 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          for attempt in 1 2 3; do
            sudo dpkg --configure -a || true
            if $APT update && $APT install -y ffmpeg xvfb libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
              libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-randr0 libxcb-render-util0 libxcb-image0 fonts-noto-cjk; then
              break
            fi
            echo "apt attempt $attempt failed or timed out"
            sleep 10
          done
          ffmpeg -version
      - run: pip install -e ".[dev]"
      - name: Tests (including the end-to-end GUI flow on a virtual display)
        run: xvfb-run -a -s "-screen 0 1280x720x24" pytest -q

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The Chocolatey feed sometimes answers 504 and choco still exits 0. Without
      # ffmpeg the tests that need it are skipped, so retry and fail loudly instead.
      - name: ffmpeg
        shell: pwsh
        run: |
          foreach ($attempt in 1..3) {
            choco install ffmpeg -y --no-progress
            if (Get-Command ffmpeg -ErrorAction SilentlyContinue) { break }
            Write-Host "ffmpeg is not installed after attempt $attempt"
            if ($attempt -lt 3) { Start-Sleep -Seconds 20 }
          }
          ffmpeg -version
      - run: pip install -e ".[dev]"
      - name: Tests (GUI tests run offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q
