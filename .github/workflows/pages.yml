name: Pages

# Builds the project site (site/ plus the brand files and screenshots it shows), prints the
# manual to a PDF with the runner's Chrome, and publishes both to GitHub Pages.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "packaging/build_site.py"
      - "assets/brand/**"
      - "docs/images/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer one waits instead of cutting a running one off.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build the site and the manual PDF
        run: python packaging/build_site.py -o _site --pdf
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
