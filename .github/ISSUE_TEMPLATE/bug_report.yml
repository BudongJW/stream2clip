name: 버그 제보
description: 오동작 또는 오류 제보
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: 발생한 문제
      description: 기대한 동작과 실제 동작 기재
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      description: 실행한 명령 또는 앱에서의 조작 순서. 방송 주소가 필요한 경우 공개 다시보기만 기재
      placeholder: |
        1. stream2clip fetch <주소> -o vod
        2. stream2clip auto vod/video.mp4 --chat ...
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: 출력 및 오류 메시지
      render: text
  - type: input
    id: version
    attributes:
      label: stream2clip 버전
      description: "`stream2clip --version` 결과. 설치 방식(설치 프로그램, zip, pip)도 기재"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: 운영체제 및 화면
      placeholder: "Windows 11, 배율 125%, 모니터 1대"
    validations:
      required: true
  - type: input
    id: ffmpeg
    attributes:
      label: ffmpeg 버전
      description: "`ffmpeg -version` 첫 줄. 영상 변환, 녹화 관련 문제인 경우 기재"
