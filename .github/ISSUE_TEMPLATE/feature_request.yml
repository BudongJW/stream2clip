name: 기능 제안
description: 신규 기능 또는 개선 제안
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 필요한 작업 상황
      description: 현재의 처리 방법과 불편 사항 기재
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 제안하는 동작
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 관련 영역
      options:
        - 캡쳐, 편집
        - 움짤 녹화
        - 하이라이트 검출
        - 세로 클립, 자막, 번역
        - 방송 플랫폼 (YouTube, Twitch, CHZZK, SOOP)
        - 기획사 가이드라인
        - OBS, 라이브 모드, 업로드
        - 설치, 실행 파일
        - 홈페이지, 사용 설명서
        - 기타
  - type: textarea
    id: source
    attributes:
      label: 참고 자료
      description: 기획사 가이드라인 제안 시 공식 원문 주소와 개정일 기재 필수
