[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "stream2clip"
version = "0.6.0"
description = "Stream in. Clips out. Capture, annotate, record and auto-clip VTuber streams (highlights from chat, 9:16 layouts, karaoke subtitles, GIF/MP4/WebP with transparency)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "Pillow>=10.1",
]
keywords = ["vtuber", "clip", "kirinuki", "highlight-detection", "shorts", "subtitles", "screen-capture", "gif", "webp", "ffmpeg", "chroma-key"]

[project.optional-dependencies]
capture = ["mss>=9"]
gui = ["PySide6>=6.6", "mss>=9"]
hotkey = ["pynput>=1.7"]
ocr = ["pytesseract>=0.3"]
ingest = ["yt-dlp>=2024.1"]
asr = ["faster-whisper>=1.0"]
detect = ["onnxruntime>=1.16"]
build = ["pyinstaller>=6.10"]
obs = ["websocket-client>=1.6"]
upload = ["google-api-python-client>=2.100", "google-auth-oauthlib>=1.1"]
dev = ["pytest>=8", "ruff>=0.6", "mss>=9", "PySide6>=6.6", "jsonschema>=4", "websocket-client>=1.6", "websockets>=13"]

[project.scripts]
stream2clip = "stream2clip.cli:main"

[project.gui-scripts]
stream2clip-gui = "stream2clip.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stream2clip = ["py.typed", "schemas/*.json", "gui/assets/*", "locales/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 200
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = [
    "E501",  # long lines are accepted in this code base
    "B905",  # zip() without strict= is intended where it is used
]
