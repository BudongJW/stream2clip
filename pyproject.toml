[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "stream2clip"
version = "0.1.0"
description = "Portable toolkit for capturing, annotating and recording clips (GIF/MP4/WebP, transparent background) from VTuber streams"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "Pillow>=10.1",
]
keywords = ["vtuber", "clip", "kirinuki", "screen-capture", "gif", "webp", "ffmpeg", "chroma-key"]

[project.optional-dependencies]
capture = ["mss>=9"]
gui = ["PySide6>=6.6", "mss>=9"]
hotkey = ["pynput>=1.7"]
ocr = ["pytesseract>=0.3"]
dev = ["pytest>=8", "mss>=9", "PySide6>=6.6", "jsonschema>=4"]

[project.scripts]
stream2clip = "stream2clip.cli:main"

[project.gui-scripts]
stream2clip-gui = "stream2clip.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stream2clip = ["py.typed", "schemas/*.json", "gui/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
